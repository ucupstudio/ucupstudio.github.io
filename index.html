<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Arsitek Video Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="app" v-cloak>
        <div v-if="!isLoggedIn" class="flex items-center justify-center h-screen">
            <div class="bg-white p-8 rounded-xl shadow-lg w-96">
                <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Video Manager</h1>
                <input v-model="loginForm.user" type="text" placeholder="Username" class="w-full border p-2 mb-4 rounded">
                <input v-model="loginForm.pass" type="password" placeholder="Password" class="w-full border p-2 mb-6 rounded">
                <button @click="doLogin" :disabled="loading" class="w-full bg-blue-600 text-white py-2 rounded font-bold">
                    {{ loading ? 'Processing...' : 'LOGIN' }}
                </button>
            </div>
        </div>

        <div v-else>
            <nav class="bg-white shadow-sm p-4 flex justify-between items-center">
                <h2 class="font-bold text-slate-700">My Video Cloud</h2>
                <div class="flex gap-4 items-center">
                    <button @click="showUpload = true" class="bg-green-600 text-white px-4 py-1 rounded text-sm">+ Upload</button>
                    <button @click="logout" class="text-red-500 text-sm">Logout</button>
                </div>
            </nav>

            <main class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div v-for="item in mediaList" :key="item.id" class="bg-white rounded-lg shadow overflow-hidden">
                        <video controls class="w-full aspect-video bg-black">
                            <source :src="`https://drive.google.com/uc?export=download&id=${item.file_id}`" type="video/mp4">
                        </video>
                        <div class="p-3">
                            <p class="font-bold truncate">{{ item.title }}</p>
                            <p class="text-[10px] text-gray-400">Server: {{ item.server_id }} | {{ item.created_at }}</p>
                        </div>
                    </div>
                </div>
            </main>

            <div v-if="showUpload" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4">
                <div class="bg-white p-6 rounded-xl w-full max-w-md">
                    <h3 class="text-lg font-bold mb-4">Upload ke Server Penyimpanan</h3>
                    <input v-model="newFile.title" type="text" placeholder="Judul Video" class="w-full border p-2 mb-4 rounded">
                    <select v-model="newFile.serverId" class="w-full border p-2 mb-4 rounded">
                        <option value="2">Server 2 (Akun Anak)</option>
                    </select>
                    <input type="file" @change="e => selectedFile = e.target.files[0]" class="mb-6 block w-full text-sm">
                    
                    <div class="flex justify-end gap-2">
                        <button @click="showUpload = false" class="px-4 py-2">Batal</button>
                        <button @click="handleUpload" :disabled="loading" class="bg-blue-600 text-white px-6 py-2 rounded">
                            {{ loading ? 'Uploading...' : 'Mulai Simpan' }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        const MAIN_API = "https://script.google.com/macros/s/AKfycbztTfrsbeJ_QveesN8Hov23WwHOr3Tee4FwIHtF-yrnlxxDSjFImTHdWQGXffMfpEdtzQ/exec";
        const CHILD_SERVER_2 = "https://script.google.com/macros/s/AKfycbz82CdCRvIN0oFdkpUWhHpxSa7EUXKj_5SrXw2-wGTL6Inj7geMfd-0_ZUpy8g4H_mxSg/exec";
        const SECRET = "3fb8f44a-71d5-4e1b-9a2c-9f6b3e8e7a10";

        createApp({
            setup() {
                const isLoggedIn = ref(!!localStorage.getItem('user_session'));
                const loading = ref(false);
                const showUpload = ref(false);
                const mediaList = ref([]);
                const loginForm = ref({ user: '', pass: '' });
                const newFile = ref({ title: '', serverId: '2' });
                const selectedFile = ref(null);

                const fetchVideos = async () => {
                    const res = await fetch(MAIN_API, { method: 'POST', body: JSON.stringify({ action: 'getMedia', secret: SECRET })});
                    const json = await res.json();
                    if(json.status === 'success') mediaList.value = json.data;
                };

                const doLogin = async () => {
                    loading.value = true;
                    const res = await fetch(MAIN_API, { method: 'POST', body: JSON.stringify({ action: 'login', user: loginForm.value.user, pass: loginForm.value.pass, secret: SECRET })});
                    const json = await res.json();
                    if(json.status === 'success') {
                        localStorage.setItem('user_session', 'true');
                        isLoggedIn.value = true;
                        fetchVideos();
                    } else { alert(json.message); }
                    loading.value = false;
                };

                const handleUpload = async () => {
                    if(!selectedFile.value) return;
                    loading.value = true;
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(selectedFile.value);
                    reader.onload = async () => {
                        const base64 = reader.result.split(',')[1];
                        // 1. Upload ke Server 2
                        const resAnak = await fetch(CHILD_SERVER_2, { method: 'POST', body: JSON.stringify({ action: 'upload', secret: SECRET, fileName: selectedFile.value.name, mimeType: selectedFile.value.type, fileContent: base64 })});
                        const dataAnak = await resAnak.json();

                        if(dataAnak.status === 'success') {
                            // 2. Catat ke Server Induk
                            await fetch(MAIN_API, { method: 'POST', body: JSON.stringify({ action: 'create', secret: SECRET, title: newFile.value.title, type: 'video', file_id: dataAnak.file_id, server_id: newFile.value.serverId, created_at: new Date().toLocaleString() })});
                            alert("Selesai!");
                            showUpload.value = false;
                            fetchVideos();
                        }
                        loading.value = false;
                    };
                };

                const logout = () => { localStorage.clear(); location.reload(); };
                onMounted(() => { if(isLoggedIn.value) fetchVideos(); });

                return { isLoggedIn, loading, showUpload, mediaList, loginForm, newFile, selectedFile, doLogin, handleUpload, logout };
            }
        }).mount('#app');
    </script>
</body>
</html>
