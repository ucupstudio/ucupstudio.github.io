<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsitek Video Drive - My Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        [v-cloak] { display: none; }
        .tab-active { @apply bg-white shadow text-blue-600; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
    <div id="app" v-cloak>
        
        <div v-if="!isLoggedIn" class="flex items-center justify-center h-screen px-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-blue-600">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-black text-blue-600 tracking-tight">V-DRIVE</h1>
                    <p class="text-slate-400 text-sm">Masuk ke repositori media Anda</p>
                </div>
                <div class="space-y-4">
                    <input v-model="loginForm.user" type="text" placeholder="Username" class="w-full border-2 p-3 rounded-xl focus:border-blue-500 outline-none transition">
                    <input v-model="loginForm.pass" type="password" placeholder="Password" class="w-full border-2 p-3 rounded-xl focus:border-blue-500 outline-none transition">
                    <button @click="doLogin" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-200 active:scale-95 disabled:opacity-50">
                        {{ loading ? 'Authenticating...' : 'LOGIN' }}
                    </button>
                </div>
            </div>
        </div>

        <div v-else>
            <nav class="bg-white/80 backdrop-blur-md shadow-sm p-4 flex justify-between items-center sticky top-0 z-40 border-b border-slate-200">
                <h2 class="font-black text-xl text-slate-800 flex items-center gap-2">
                    <span class="bg-blue-600 text-white px-2 py-0.5 rounded-lg text-lg">V</span> 
                    <span class="hidden sm:inline italic">MyCloud</span>
                </h2>
                <div class="flex gap-4 items-center">
                    <button @click="showUpload = true" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-bold transition shadow-md">+ Upload Baru</button>
                    <button @click="logout" class="text-red-500 hover:bg-red-50 font-bold px-3 py-2 rounded-lg text-sm transition">Keluar</button>
                </div>
            </nav>

            <main class="p-6 max-w-7xl mx-auto">
                <div class="flex space-x-2 mb-8 bg-slate-200 p-1.5 rounded-2xl w-fit mx-auto sm:mx-0">
                    <button @click="currentTab = 'video'" :class="currentTab === 'video' ? 'bg-white shadow text-blue-600' : 'text-slate-500'" class="px-8 py-2.5 rounded-xl font-bold transition text-sm uppercase tracking-wider">Video</button>
                    <button @click="currentTab = 'image'" :class="currentTab === 'image' ? 'bg-white shadow text-blue-600' : 'text-slate-500'" class="px-8 py-2.5 rounded-xl font-bold transition text-sm uppercase tracking-wider">Foto</button>
                </div>
                
                <div v-if="filteredMedia.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <div v-for="item in filteredMedia" :key="item.id" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden group hover:shadow-xl transition-all duration-300">
                        <div class="relative overflow-hidden">
                            <video v-if="item.type === 'video'" controls class="w-full aspect-video bg-black object-contain">
                                <source :src="`https://drive.google.com/uc?export=download&id=${item.file_id}`" type="video/mp4">
                            </video>
                            <img v-else :src="`https://drive.google.com/uc?export=view&id=${item.file_id}`" class="w-full aspect-video object-cover transition duration-500 group-hover:scale-105" loading="lazy">
                        </div>
                        
                        <div class="p-4 bg-white">
                            <h4 class="font-bold text-slate-800 truncate mb-1" :title="item.title">{{ item.title }}</h4>
                            <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-50">
                                <span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter">ID: {{ item.server_id }}</span>
                                <p class="text-[10px] text-slate-400 font-medium italic">{{ item.created_at }}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div v-else class="text-center py-32 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                    <div class="text-6xl mb-4">📂</div>
                    <p class="text-slate-500 font-medium italic">Belum ada file di kategori {{ currentTab }}</p>
                </div>
            </main>

            <div v-if="showUpload" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
                    <h3 class="text-2xl font-black mb-6 text-slate-800">Simpan ke Cloud</h3>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1 ml-1">Nama Konten</label>
                            <input v-model="newFile.title" type="text" placeholder="Berikan judul..." class="w-full border-2 p-3 rounded-xl focus:border-blue-500 outline-none transition">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1 ml-1">Pilih File</label>
                            <div class="p-4 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 hover:bg-white transition cursor-pointer relative">
                                <input type="file" @change="e => selectedFile = e.target.files[0]" class="absolute inset-0 opacity-0 cursor-pointer">
                                <div class="text-center">
                                    <span class="text-sm text-slate-500">{{ selectedFile ? selectedFile.name : 'Klik untuk cari file...' }}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-400 mb-1 ml-1">Server Penyimpanan</label>
                            <select v-model="newFile.serverId" class="w-full border-2 p-3 rounded-xl bg-slate-50 outline-none">
                                <option value="2">Server 2 (Akun Anak)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="flex justify-end gap-3 mt-10">
                        <button @click="showUpload = false" class="px-6 py-2 text-slate-400 font-bold hover:text-slate-800 transition">Batal</button>
                        <button @click="handleUpload" :disabled="loading" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-blue-200 disabled:opacity-50 transition active:scale-95">
                            {{ loading ? 'Mengunggah...' : 'Konfirmasi & Simpan' }}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        // --- KONFIGURASI URL (PASTIKAN SUDAH /EXEC) ---
        const MAIN_API = "https://script.google.com/macros/s/AKfycbxhj3VqrRI5GREUNRc0aH98G6KGsXvbuOhLqpj4GykSVFF26dLIrOKcvJPmDRysQpyptQ/exec";
        const CHILD_SERVER_2 = "https://script.google.com/macros/s/AKfycbz0o5yY1pEtgyugDmmTry9r4P-MKC2oJaZBUSIcgrB3V3Ooi7XGfAGrIs1qeDyo6OHBsA/exec"; // Link baru Anda
        const SECRET = "3fb8f44a-71d5-4e1b-9a2c-9f6b3e8e7a10";

        createApp({
            setup() {
                const isLoggedIn = ref(!!localStorage.getItem('user_session'));
                const loading = ref(false);
                const showUpload = ref(false);
                const currentTab = ref('video');
                const mediaList = ref([]);
                const loginForm = ref({ user: '', pass: '' });
                const newFile = ref({ title: '', serverId: '2' });
                const selectedFile = ref(null);

                const filteredMedia = computed(() => {
                    return mediaList.value.filter(item => item.type === currentTab.value);
                });

                const fetchMedia = async () => {
                    try {
                        const res = await fetch(MAIN_API, { method: 'POST', body: JSON.stringify({ action: 'getMedia', secret: SECRET })});
                        const json = await res.json();
                        if(json.status === 'success') mediaList.value = json.data;
                    } catch (e) { console.error("Gagal sinkronisasi data"); }
                };

                const doLogin = async () => {
                    if(!loginForm.value.user || !loginForm.value.pass) return alert("Isi form!");
                    loading.value = true;
                    try {
                        const res = await fetch(MAIN_API, { method: 'POST', body: JSON.stringify({ action: 'login', user: loginForm.value.user, pass: loginForm.value.pass, secret: SECRET })});
                        const json = await res.json();
                        if(json.status === 'success') {
                            localStorage.setItem('user_session', 'true');
                            isLoggedIn.value = true;
                            fetchMedia();
                        } else { alert("Login Gagal: " + json.message); }
                    } catch (e) { alert("Server tidak merespon!"); }
                    loading.value = false;
                };

                const handleUpload = async () => {
                    if(!selectedFile.value || !newFile.value.title) return alert("Judul dan File wajib diisi!");
                    loading.value = true;
                    
                    // Deteksi Otomatis Tipe File
                    const fileType = selectedFile.value.type.includes('image') ? 'image' : 'video';
                    
                    const reader = new FileReader();
                    reader.readAsDataURL(selectedFile.value);
                    reader.onload = async () => {
                        try {
                            const base64 = reader.result.split(',')[1];
                            
                            const resAnak = await fetch(CHILD_SERVER_2, { 
                                method: 'POST', 
                                body: JSON.stringify({ 
                                    action: 'upload', 
                                    secret: SECRET, 
                                    title: newFile.value.title,
                                    type: fileType,
                                    serverId: newFile.value.serverId,
                                    fileName: selectedFile.value.name, 
                                    mimeType: selectedFile.value.type, 
                                    fileContent: base64 
                                })
                            });
                            
                            const result = await resAnak.json();

                            if(result.status === 'success') {
                                alert("File Tersimpan & Tercatat!");
                                location.reload(); // Refresh total agar data sinkron
                            } else {
                                alert("Gagal Simpan: " + result.message);
                            }
                        } catch (e) {
                            alert("Koneksi ke Server Anak Bermasalah!");
                        } finally {
                            loading.value = false;
                        }
                    };
                };

                const logout = () => { localStorage.clear(); location.reload(); };
                onMounted(() => { if(isLoggedIn.value) fetchMedia(); });

                return { 
                    isLoggedIn, loading, showUpload, mediaList, 
                    currentTab, filteredMedia, loginForm, 
                    newFile, selectedFile, doLogin, handleUpload, logout 
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
